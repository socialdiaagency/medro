name: Deploy MedRo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # اختياري: لو أضفت المتغيرين في Settings > Secrets and variables > Actions > Variables
      # يُكتب config.js تلقائيًا ولا تحتاج تعديله يدويًا.
      - name: Inject Supabase config from repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i "s|SUPABASE_URL: \"[^\"]*\"|SUPABASE_URL: \"$SUPABASE_URL\"|; s|SUPABASE_ANON_KEY: \"[^\"]*\"|SUPABASE_ANON_KEY: \"$SUPABASE_ANON_KEY\"|" config.js
            echo "config.js generated from repository variables"
          else
            echo "No repository variables set; using config.js from the repo"
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html config.js manifest.webmanifest sw.js privacy.html delete-account.html .nojekyll css js assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
